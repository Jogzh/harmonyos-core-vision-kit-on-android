plugins { id 'com.android.application' }

android {
    namespace 'dev.corevision.sample'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'dev.corevision.sample'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName rootProject.corevisionVersion
        testInstrumentationRunner 'dev.corevision.android.AcceptanceInstrumentation'
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += ['**/*.so']
        }
    }
}

dependencies {
    if (providers.gradleProperty('corevisionUseMaven').map { it.toBoolean() }.getOrElse(false)) {
        implementation "dev.corevision:corevision-android:${rootProject.corevisionVersion}"
    } else {
        def aar = project(':corevision-android').layout.buildDirectory.file('outputs/aar/corevision-android-release.aar')
        implementation files(aar).builtBy(':corevision-android:bundleReleaseAar')
    }
}

def runtimeDir = providers.gradleProperty('corevisionRuntimeDir')
if (runtimeDir.isPresent()) {
    def bundle = file(runtimeDir.get())
    def validator = rootProject.file('tools/runtime_bundle.py')
    android.sourceSets.main.jniLibs.srcDir(new File(bundle, 'jniLibs'))
    android.sourceSets.main.assets.srcDir(new File(bundle, 'assets'))

    def verifyRuntime = tasks.register('verifyRuntimeBundle', Exec) {
        commandLine 'python3', validator, 'verify', bundle
    }
    tasks.named('preBuild').configure { dependsOn verifyRuntime }
    tasks.register('verifyRuntimeApk', Exec) {
        dependsOn 'assembleDebug'
        commandLine 'python3', validator, 'verify-apk', bundle,
                layout.buildDirectory.file('outputs/apk/debug/sample-debug.apk').get().asFile
    }
}
