pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        exclusiveContent {
            forRepository {
                maven { url = uri('build/maven') }
            }
            filter { includeGroup('dev.corevision') }
        }
        google()
        mavenCentral()
    }
}

rootProject.name = 'harmonyos-core-vision-kit-on-android'
include ':corevision-android', ':sample'
